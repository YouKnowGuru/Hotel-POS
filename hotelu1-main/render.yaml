services:
  - type: web
    name: hotelu1-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: DB_DIALECT
        value: postgres
      - key: DB_SSL
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: hotelu1-db
          property: connectionString

databases:
  - name: hotelu1-db
    plan: free
    databaseName: hotelu1
    user: hotelu1
