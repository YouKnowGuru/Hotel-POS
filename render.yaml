services:
  - type: web
    name: hotel-pos-backend
    env: node
    plan: free
    rootDir: hotelu1-main/backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        # SECURITY: never "*" — an open CORS lets any website call this API
        # with credentials. Replace with your real frontend origin(s),
        # comma-separated, e.g. https://your-site.vercel.app
        value: "CHANGE_ME_TO_YOUR_FRONTEND_URL"
      - key: DB_DIALECT
        value: mysql
      - key: DB_SSL
        value: "true"
